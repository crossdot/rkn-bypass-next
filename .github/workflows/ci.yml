name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy -- -D warnings
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      - name: cargo build
        run: cargo build

  docker-smoke:
    name: docker build + smoke + SBOM + sign (ADR-011)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (for admin-cli)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"

      - uses: Swatinem/rust-cache@v2

      - name: Build images + smoke test
        run: bash deploy/docker/smoke-test.sh

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images to GHCR (capture digests)
        run: |
          docker tag rkn-server:test ghcr.io/${{ github.repository }}/rkn-server:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/rkn-server:${{ github.sha }}
          docker tag rkn-client:test ghcr.io/${{ github.repository }}/rkn-client:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/rkn-client:${{ github.sha }}
          echo "SERVER_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/${{ github.repository }}/rkn-server:${{ github.sha }} | cut -d'@' -f2)" >> "$GITHUB_ENV"
          echo "CLIENT_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/${{ github.repository }}/rkn-client:${{ github.sha }} | cut -d'@' -f2)" >> "$GITHUB_ENV"

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM (CycloneDX JSON, named by digest)
        run: |
          syft "ghcr.io/${{ github.repository }}/rkn-server@$SERVER_DIGEST" -o cyclonedx-json > "rkn-server-$SERVER_DIGEST.cdx.json"
          syft "ghcr.io/${{ github.repository }}/rkn-client@$CLIENT_DIGEST" -o cyclonedx-json > "rkn-client-$CLIENT_DIGEST.cdx.json"
          test -s "rkn-server-$SERVER_DIGEST.cdx.json" && test -s "rkn-client-$CLIENT_DIGEST.cdx.json"

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: '*.cdx.json'

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign images (keyless, by digest)
        run: |
          cosign sign --yes "ghcr.io/${{ github.repository }}/rkn-server@$SERVER_DIGEST"
          cosign sign --yes "ghcr.io/${{ github.repository }}/rkn-client@$CLIENT_DIGEST"

      - name: Verify signatures
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "ghcr.io/${{ github.repository }}/rkn-server@$SERVER_DIGEST"
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "ghcr.io/${{ github.repository }}/rkn-client@$CLIENT_DIGEST"
