name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy -- -D warnings
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      - name: cargo build
        run: cargo build

  e2e:
    name: e2e (tls + quic + auto + fallback)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"

      - uses: Swatinem/rust-cache@v2

      - name: Build binaries
        run: cargo build --workspace

      # Отдельный job: не замедляет check; ловит регрессии политики выбора
      # транспорта (ADR-023) — manual tls/quic, auto, dual-listen, UDP fallback.
      - name: Run e2e (ADR-023)
        run: bash scripts/e2e.sh

  load-smoke:
    name: load smoke (P11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"

      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --workspace

      # Отдельный job (не замедляет check): дымовой нагрузочный прогон P11.
      # Скрипт сам стартует server+client, гонит 10 воркеров 30с и падает
      # при ошибках / росте fd/tasks.
      - name: Load smoke (P11)
        run: bash scripts/load.sh --clients 10 --transport auto --duration 30 --scenario basic

  docker-smoke:
    name: docker build + smoke + SBOM + sign (ADR-011)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (for admin-cli)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"

      - uses: Swatinem/rust-cache@v2

      - name: Build images + smoke test
        run: bash deploy/docker/smoke-test.sh

      # Подпись/push/SBOM — только на push или ручной запуск (workflow_dispatch)
      # с master; с других веток не пушит и не подписывает. Якорь identity
      # @refs/heads/master$ остаётся валидным и для ручных запусков, потому
      # что у workflow_dispatch с master ref = refs/heads/master.
      - name: Login to GHCR
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images to GHCR (capture digests)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
        run: |
          docker tag rkn-server:test ghcr.io/${{ github.repository }}/rkn-server:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/rkn-server:${{ github.sha }}
          docker tag rkn-client:test ghcr.io/${{ github.repository }}/rkn-client:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/rkn-client:${{ github.sha }}
          SERVER_DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/${{ github.repository }}/rkn-server:${{ github.sha }} | cut -d'@' -f2)"
          CLIENT_DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/${{ github.repository }}/rkn-client:${{ github.sha }} | cut -d'@' -f2)"
          echo "SERVER_DIGEST=$SERVER_DIGEST" >> "$GITHUB_ENV"
          echo "CLIENT_DIGEST=$CLIENT_DIGEST" >> "$GITHUB_ENV"
          # upload-artifact@v4 не допускает ':' в именах файлов — для имени SBOM
          # заменяем ':' на '-'. DIGEST (с ':') остаётся для cosign sign/verify.
          echo "SERVER_DIGEST_SAFE=${SERVER_DIGEST//:/-}" >> "$GITHUB_ENV"
          echo "CLIENT_DIGEST_SAFE=${CLIENT_DIGEST//:/-}" >> "$GITHUB_ENV"

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM (CycloneDX JSON, named by digest)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
        run: |
          SBOM_DIR="${{ github.workspace }}/sbom"
          mkdir -p "$SBOM_DIR"
          syft "ghcr.io/${{ github.repository }}/rkn-server@$SERVER_DIGEST" -o "cyclonedx-json=$SBOM_DIR/rkn-server-$SERVER_DIGEST_SAFE.cdx.json"
          syft "ghcr.io/${{ github.repository }}/rkn-client@$CLIENT_DIGEST" -o "cyclonedx-json=$SBOM_DIR/rkn-client-$CLIENT_DIGEST_SAFE.cdx.json"
          test -s "$SBOM_DIR/rkn-server-$SERVER_DIGEST_SAFE.cdx.json" && test -s "$SBOM_DIR/rkn-client-$CLIENT_DIGEST_SAFE.cdx.json"

      - name: Upload SBOM artifacts
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: ${{ github.workspace }}/sbom/*.cdx.json
          if-no-files-found: error

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign images (keyless, by digest)
        id: sign
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
        run: |
          cosign sign --yes "ghcr.io/${{ github.repository }}/rkn-server@$SERVER_DIGEST"
          cosign sign --yes "ghcr.io/${{ github.repository }}/rkn-client@$CLIENT_DIGEST"

      # verify выполняется только после фактически успешной подписи.
      # Выбран `steps.sign.outcome == 'success'`, а не то же условие:
      # привязка к факту подписи, а не к ветке. На PR и на workflow_dispatch
      # с не-master ветки sign пропущен (outcome = skipped) → verify пропущен
      # и не падает из-за отсутствия подписи; на push в master и на ручном
      # запуске с master verify идёт после успешного sign.
      - name: Verify signatures
        if: steps.sign.outcome == 'success'
        run: |
          for ref in \
            "ghcr.io/${{ github.repository }}/rkn-server@$SERVER_DIGEST" \
            "ghcr.io/${{ github.repository }}/rkn-client@$CLIENT_DIGEST"; do
            cosign verify \
              --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/master$" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$ref"
          done
