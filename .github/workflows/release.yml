name: Release

# P10: релизные артефакты. Отдельный workflow (не замедляет основной CI).
# Триггеры: тег v* (релиз) и ручной запуск (dry-run: build+SBOM+sign+artifact,
# без GitHub Release).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"

      - uses: Swatinem/rust-cache@v2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Build release artifacts
        run: |
          set -euo pipefail
          VERSION="$GITHUB_REF_NAME"
          case "$VERSION" in
            v*) ;;
            *) VERSION="dev-${GITHUB_SHA:0:7}" ;;
          esac
          bash scripts/release.sh --require-sbom --version "$VERSION"

      - name: Sign checksums (cosign keyless)
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --output-signature dist/SHA256SUMS.sig \
            --output-certificate dist/SHA256SUMS.pem \
            dist/SHA256SUMS

      - name: Verify checksums signature
        run: |
          set -euo pipefail
          cosign verify-blob \
            --certificate dist/SHA256SUMS.pem \
            --signature dist/SHA256SUMS.sig \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/(tags|heads)/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            dist/SHA256SUMS

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/sbom.cdx.json
            dist/SHA256SUMS.sig
            dist/SHA256SUMS.pem
          generate_release_notes: true

      - name: Upload artifacts (workflow_dispatch dry-run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/*
